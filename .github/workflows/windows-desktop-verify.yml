name: Diagnose packaged Windows icon cold start
run-name: Diagnose Windows v0.8.3 icon cold start

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-icon-startup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-icon-startup:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QQPET_DISABLE_TG: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Validate and download the existing verified package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          REPO = "mps233/QQPet-Steward"
          RUN = 40207354810
          BASE = "ff3ff2fb97e3e292daad2945369ca8576c85f3e7"
          VERSION = "0.8.3"
          ARTIFACT = "windows-desktop-v" + VERSION
          PREFIX = "QQPet-Steward_" + VERSION + "_windows_x64"
          PAYLOADS = (PREFIX + "-setup.exe", PREFIX + "-native.zip")
          REPORTS = (
              "windows-native-backend-verification.json",
              "windows-installed-backend-verification.json",
              "windows-native-verification.json",
          )
          EXPECTED = {*PAYLOADS, *(name + ".sha256" for name in PAYLOADS),
                      *REPORTS, "windows-native-app.png"}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def command(*args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=600)
              # A failed artifact download may include a signed URL in stderr.
              require(result.returncode == 0, "Command failed; credentials and download URLs withheld")
              return result.stdout

          def api(path):
              return json.loads(command("gh", "api", "--hostname", "github.com", path))

          require(os.environ.get("GITHUB_REPOSITORY") == REPO, "Unexpected repository")
          run = api(f"repos/{REPO}/actions/runs/{RUN}")
          require(run.get("repository", {}).get("full_name") == REPO
                  and run.get("head_repository", {}).get("full_name") == REPO
                  and run.get("head_branch") == "main" and run.get("head_sha") == BASE
                  and run.get("path") == ".github/workflows/windows-desktop.yml"
                  and run.get("event") == "workflow_dispatch"
                  and run.get("status") == "completed" and run.get("conclusion") == "success",
                  "The package must come from the exact successful v0.8.3 native build")
          require(api(f"repos/{REPO}/commits/v{VERSION}").get("sha") == BASE,
                  "The release tag differs from the verified build")
          require(json.loads(Path("desktop/macos/tauri.conf.json").read_text())["version"] == VERSION,
                  "The checkout version differs from v0.8.3")
          command("git", "merge-base", "--is-ancestor", BASE, "HEAD")
          changed = command("git", "diff", "--name-only", BASE, "HEAD").splitlines()
          allowed = re.compile(
              r"^(?:tests/|\.github/workflows/|desktop/windows/(?:verify[^/]*|webview_test_environment|icon_startup_probe)\.py$)"
          )
          require(all(allowed.match(name) for name in changed),
                  "Diagnostic branch changes production files outside the permitted tool paths")
          artifacts = api(f"repos/{REPO}/actions/runs/{RUN}/artifacts?per_page=100")
          require(type(artifacts.get("total_count")) is int and artifacts["total_count"] <= 100,
                  "Artifact listing is incomplete")
          found = [item for item in artifacts.get("artifacts", [])
                   if item.get("name") == ARTIFACT and item.get("expired") is False]
          require(len(found) == 1, "The exact verified artifact is unavailable")
          origin = found[0].get("workflow_run", {})
          require(origin.get("id") == RUN and origin.get("head_sha") == BASE
                  and origin.get("head_branch") == "main", "Artifact origin differs")
          destination = Path("build/icon-candidate")
          destination.mkdir(parents=True, exist_ok=True)
          command("gh", "run", "download", str(RUN), "--repo", REPO,
                  "--name", ARTIFACT, "--dir", str(destination))
          entries = list(destination.rglob("*"))
          require(all(not path.is_symlink() for path in entries), "Unexpected artifact symlink")
          files = [path for path in entries if path.is_file()]
          require(len(files) == len(EXPECTED)
                  and {path.name for path in files} == EXPECTED, "Unexpected artifact file set")
          by_name = {path.name: path for path in files}
          hashes = {}
          for name in PAYLOADS:
              sidecar = by_name[name + ".sha256"].read_text(encoding="utf-8-sig").strip()
              match = re.fullmatch(r"([0-9a-fA-F]{64})[ \t]+\*?" + re.escape(name), sidecar)
              with by_name[name].open("rb") as stream:
                  sha = hashlib.file_digest(stream, "sha256").hexdigest()
              require(match is not None and match.group(1).lower() == sha,
                      "Verified package checksum differs: " + name)
              hashes[name] = sha
          for name in REPORTS:
              report = json.loads(by_name[name].read_text(encoding="utf-8-sig"))
              checks = report.get("checks")
              require(report.get("ok") is True and report.get("platform") == "win32"
                      and isinstance(checks, list) and bool(checks)
                      and all(isinstance(check, dict) and check.get("ok") is True for check in checks),
                      "The original Windows verification report did not pass: " + name)
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          shutil.copy2(by_name[PAYLOADS[0]], dist / PAYLOADS[0])
          output = Path("build/icon-startup")
          output.mkdir(parents=True, exist_ok=True)
          (output / "package-source.json").write_text(json.dumps({
              "repository": REPO, "verifiedRunId": RUN, "artifactId": found[0]["id"],
              "productionSha": BASE, "diagnosticSha": os.environ.get("GITHUB_SHA"),
              "version": VERSION, "diagnosticOnlyChanges": changed, "sha256": hashes,
          }, indent=2) + "\n", encoding="utf-8")
          print("Verified the original v0.8.3 package, reports and checksum sidecars")
          PY
      - name: Install diagnostic dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install "Pillow>=10" "playwright>=1.50,<2"
          .venv/Scripts/python.exe -m pip check
      - name: Install the actual v0.8.3 application
        id: install
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $Setup = Join-Path (Resolve-Path dist) "QQPet-Steward_0.8.3_windows_x64-setup.exe"
          $InstallDir = Join-Path $env:RUNNER_TEMP "QQPetIconStartupInstall"
          $Installer = Start-Process -FilePath $Setup -ArgumentList @("/S", "/D=$InstallDir") -Wait -PassThru
          if ($Installer.ExitCode -ne 0) { throw "NSIS install failed: $($Installer.ExitCode)" }
          $Required = @(
            "QQPet-Steward.exe", "backend\.build-fingerprint",
            "backend\QQPetCopilot.exe", "backend\QQPetCopilotScheduler.exe",
            "backend\_internal\python313.dll", "backend\_internal\web\dist\index.html",
            "backend\_internal\static\qp-icons\official\cap_coin.png",
            "backend\_internal\static\qp-icons\official\cap_paw.png",
            "backend\_internal\static\qp-icons\official\pk_words.png",
            "backend\_internal\static\qp-icons\official\cap_compass.png",
            "backend\_internal\static\qp-icons\official\cap_cookie.png",
            "backend\_internal\static\qp-icons\official\cap_diamond.png"
          )
          foreach ($Relative in $Required) {
            if (-not (Test-Path -LiteralPath (Join-Path $InstallDir $Relative) -PathType Leaf)) {
              throw "The installed application omitted required resource: $Relative"
            }
          }
          "executable=$(Join-Path $InstallDir 'QQPet-Steward.exe')" >> $env:GITHUB_OUTPUT
      - name: Trace three real WebView2 cold starts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .venv/Scripts/python.exe desktop/windows/icon_startup_probe.py --executable "${{ steps.install.outputs.executable }}" --report build/icon-startup/report.json --output-directory build/icon-startup
      - name: Upload only diagnostic JSON and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-icon-startup-083
          path: |
            build/icon-startup/**/*.json
            build/icon-startup/**/*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
