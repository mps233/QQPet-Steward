name: Verify existing Windows desktop candidate
run-name: Verify Windows candidate from run ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Windows build run containing the v0.8.2 candidate
        required: true
        default: "40170287527"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-desktop-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QQPET_DISABLE_TG: "1"
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Validate source and download the exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $Repo = "mps233/QQPet-Steward"
          $Baseline = "a52952380cd3e8b5ccbefabb10f5916cc8c455dd"
          $Version = "0.8.2"
          $RunId = $env:CANDIDATE_RUN_ID
          if ($env:GITHUB_REPOSITORY -cne $Repo -or $RunId -notmatch '^[0-9]+$') {
            throw "The candidate must come from this repository and a numeric run ID"
          }
          $Run = gh api "repos/$Repo/actions/runs/$RunId" | ConvertFrom-Json
          if ($Run.repository.full_name -cne $Repo -or
              $Run.head_repository.full_name -cne $Repo -or
              $Run.head_branch -cne "main" -or
              $Run.head_sha -cne $Baseline -or
              $Run.event -cne "workflow_dispatch" -or
              $Run.path -cne ".github/workflows/windows-desktop.yml" -or
              $Run.status -cne "completed") {
            throw "The candidate run does not match the trusted native build source"
          }
          $CurrentVersion = (Get-Content desktop/macos/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($CurrentVersion -cne $Version) {
            throw "The verifier checkout no longer matches candidate version $Version"
          }
          git merge-base --is-ancestor $Baseline HEAD
          $Changed = @(git diff --name-only $Baseline HEAD)
          $Forbidden = @($Changed | Where-Object {
            $_ -notmatch '^(tests/|\.github/workflows/|desktop/windows/(verify_native|verify_portable|webview_test_environment)\.py$)'
          })
          if ($Forbidden.Count -gt 0) {
            throw "Production files differ from the compiled candidate: $($Forbidden -join ', ')"
          }
          $ArtifactName = "windows-desktop-candidate-v$Version"
          $Artifacts = (gh api "repos/$Repo/actions/runs/$RunId/artifacts" | ConvertFrom-Json).artifacts
          $Candidate = @($Artifacts | Where-Object { $_.name -ceq $ArtifactName -and -not $_.expired })
          if ($Candidate.Count -ne 1) {
            throw "The exact unexpired native candidate artifact was not found"
          }
          gh run download $RunId --repo $Repo --name $ArtifactName --dir build/candidate
          $Prefix = "QQPet-Steward_${Version}_windows_x64"
          $Expected = @("$Prefix-setup.exe", "$Prefix-setup.exe.sha256",
                        "$Prefix-native.zip", "$Prefix-native.zip.sha256")
          $Files = @(Get-ChildItem build/candidate -Recurse -File)
          if ($Files.Count -ne $Expected.Count) {
            throw "The candidate artifact contains an unexpected number of files"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($Name in $Expected) {
            $Matches = @($Files | Where-Object { $_.Name -ceq $Name })
            if ($Matches.Count -ne 1) {
              throw "Missing or duplicate candidate file: $Name"
            }
            Copy-Item -LiteralPath $Matches[0].FullName -Destination (Join-Path dist $Name)
          }
          $Hashes = @{}
          foreach ($Name in @("$Prefix-setup.exe", "$Prefix-native.zip")) {
            $Parts = (Get-Content -LiteralPath "dist/$Name.sha256" -Raw).Trim() -split '\s+', 2
            if ($Parts.Count -ne 2 -or $Parts[0] -notmatch '^[0-9a-fA-F]{64}$' -or $Parts[1] -cne $Name) {
              throw "Invalid candidate SHA-256 sidecar: $Name"
            }
            $Actual = (Get-FileHash -LiteralPath "dist/$Name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Actual -cne $Parts[0].ToLowerInvariant()) {
              throw "Candidate checksum mismatch: $Name"
            }
            $Hashes[$Name] = $Actual
          }
          @{
            repository = $Repo; candidateRunId = $RunId; productionSha = $Baseline
            verificationSha = $env:GITHUB_SHA; version = $Version
            verificationOnlyChanges = $Changed; sha256 = $Hashes
          } | ConvertTo-Json -Depth 5 | Set-Content build/windows-candidate-source.json -Encoding utf8
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Install verification dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-dev.txt "Pillow>=10" "playwright>=1.50,<2" "PyYAML>=6"
          .venv/Scripts/python.exe -m pip check
          .venv/Scripts/python.exe -m pytest -q tests/test_windows_native_verify.py tests/test_windows_webview_test_environment.py
      - name: Install the actual candidate NSIS deliverable
        id: install
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $Version = "${{ steps.candidate.outputs.version }}"
          $Setup = Join-Path (Resolve-Path dist) "QQPet-Steward_${Version}_windows_x64-setup.exe"
          $InstallDir = Join-Path $env:RUNNER_TEMP "QQPetNativeInstall"
          $Installer = Start-Process -FilePath $Setup -ArgumentList @("/S", "/D=$InstallDir") -Wait -PassThru
          if ($Installer.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($Installer.ExitCode)"
          }
          $RequiredFiles = @(
            "QQPet-Steward.exe",
            "backend\.build-fingerprint",
            "backend\QQPetCopilot.exe",
            "backend\QQPetCopilotScheduler.exe",
            "backend\_internal\python313.dll",
            "backend\_internal\web\dist\index.html",
            "backend\_internal\static\icon-512.png"
          )
          foreach ($Relative in $RequiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $InstallDir $Relative) -PathType Leaf)) {
              throw "The candidate installer omitted a required App file: $Relative"
            }
          }
          $Shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\QQPet-Steward\QQPet-Steward.lnk"
          if (-not (Test-Path -LiteralPath $Shortcut -PathType Leaf)) {
            throw "The candidate installer did not create the per-user Start menu shortcut"
          }
          "executable=$(Join-Path $InstallDir 'QQPet-Steward.exe')" >> $env:GITHUB_OUTPUT
          "backend=$(Join-Path $InstallDir 'backend')" >> $env:GITHUB_OUTPUT
      - name: Verify the installed candidate Python backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .venv/Scripts/python.exe desktop/windows/verify_portable.py --directory "${{ steps.install.outputs.backend }}" --report build/windows-installed-backend-verification.json
      - name: Verify the installed candidate native App
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .venv/Scripts/python.exe desktop/windows/verify_native.py --executable "${{ steps.install.outputs.executable }}" --report build/windows-native-verification.json --screenshot build/windows-native-app.png
      - name: Upload verified Windows App
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-desktop-v${{ steps.candidate.outputs.version }}
          path: |
            dist/QQPet-Steward_*_windows_x64-setup.exe
            dist/QQPet-Steward_*_windows_x64-setup.exe.sha256
            dist/QQPet-Steward_*_windows_x64-native.zip
            dist/QQPet-Steward_*_windows_x64-native.zip.sha256
            build/windows-candidate-source.json
            build/windows-installed-backend-verification.json
            build/windows-native-verification.json
            build/windows-native-app.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload candidate verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-desktop-verify-diagnostics
          path: |
            build/windows-candidate-source.json
            build/windows-installed-backend-verification.json
            build/windows-native-verification.json
            build/windows-native-app*.png
          if-no-files-found: ignore
          retention-days: 7
