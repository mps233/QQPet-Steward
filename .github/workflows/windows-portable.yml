name: Build Windows portable
run-name: Build Windows portable from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      QQPET_DISABLE_TG: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            desktop/windows/requirements-build.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.txt -r requirements-dev.txt -r desktop/windows/requirements-build.txt
          .venv/Scripts/python.exe -m pip check
      - name: Build and check the dashboard
        working-directory: web
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global pnpm@10.18.0
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test
      - name: Test Windows packaging and runtime helpers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .venv/Scripts/python.exe -m pytest -q tests/test_runtime_process.py tests/test_runtime_process_frozen_launcher.py tests/test_windows_runtime_self_test.py tests/test_windows_portable_build.py tests/test_windows_portable_verify.py
      - name: Build the complete portable package
        run: .venv/Scripts/python.exe desktop/windows/build_portable.py
      - name: Verify frozen executables and local dashboard
        id: verify
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $Version = (Get-Content desktop/macos/tauri.conf.json -Raw | ConvertFrom-Json).version
          $Package = Join-Path (Resolve-Path dist) "QQPet-Steward_${Version}_windows_x64"
          .venv/Scripts/python.exe desktop/windows/verify_portable.py --directory $Package --report build/windows-verification.json
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Upload verified Windows download
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-portable-v${{ steps.verify.outputs.version }}
          path: |
            dist/QQPet-Steward_*_windows_x64.zip
            dist/QQPet-Steward_*_windows_x64.zip.sha256
            build/windows-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            build/windows-verification.json
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 7
