<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>QQPet-Steward</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body data-ready="false">
    <div id="scrim" class="scrim" aria-hidden="true"></div>
    <main id="panel-card" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header class="panel-head">
        <div class="brand">
          <img class="brand-mark" src="brand-face.png" alt="" aria-hidden="true" />
          <div class="brand-copy">
            <h1 id="panel-title" class="brand-title">QQPet-Steward</h1>
            <p class="brand-subtitle">QQ宠物托管</p>
          </div>
        </div>
        <span id="conn-state" class="conn-state" data-state="loading">
          <i aria-hidden="true"></i><span>读取中</span>
        </span>
      </header>

      <section class="hero-card" aria-live="polite">
        <div class="hero-top">
          <span id="runner-dot" class="runner-dot idle" aria-hidden="true"></span>
          <strong id="runner-state">正在读取托管状态</strong>
          <span class="runner-uptime" aria-live="off">已运行 <b id="uptime">—</b></span>
        </div>
        <div class="activity-row">
          <p id="activity" class="activity">连接本机仪表盘…</p>
          <span id="remaining" class="remaining"></span>
        </div>
        <p id="detail" class="detail"></p>
        <div class="mini-stats">
          <span><b id="learn-min">—</b> 学习</span>
          <span><b id="work-min">—</b> 打工</span>
          <span><b id="eff-pct">—</b> 效率</span>
        </div>
      </section>

      <section class="summary-card">
        <div class="summary-head">
          <span>今日进度</span>
          <span id="next-task" class="next-task"></span>
        </div>
        <div class="summary-grid">
          <span><b id="today-total">—</b><small>分钟合计</small></span>
          <span><b id="queue-pending">—</b><small>待执行</small></span>
        </div>
      </section>

      <section id="update-card" class="summary-card update-card" data-state="idle">
        <div class="summary-head">
          <span id="update-title">版本更新</span>
          <span id="update-state" class="next-task">未检查</span>
        </div>
        <p id="update-detail" class="detail">点击「检查更新」查看新版本。</p>
        <div id="update-progress" class="update-track" hidden><i></i></div>
        <div class="update-actions">
          <button id="update-action" class="secondary" type="button" hidden>打开发布页</button>
          <button id="update-check" class="secondary" type="button">检查更新</button>
        </div>
      </section>

      <section class="actions">
        <button id="toggle-runner" type="button" disabled>启动托管</button>
        <button id="pause-runner" class="secondary" type="button" disabled>暂停</button>
        <button id="open-dashboard" class="secondary" type="button">打开主界面</button>
      </section>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <footer class="panel-foot">
        <button id="open-settings" class="icon-button" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9.75 3.6.75-1.6h3l.75 1.6 2.1.9 1.65-.6 2.1 2.1-.6 1.65.9 2.1 1.6.75v3l-1.6.75-.9 2.1.6 1.65-2.1 2.1-1.65-.6-2.1.9-.75 1.6h-3l-.75-1.6-2.1-.9-1.65.6-2.1-2.1.6-1.65-.9-2.1-1.6-.75v-3l1.6-.75.9-2.1-.6-1.65L6 3.9l1.65.6Z" />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
        </button>
        <button id="quit-app" class="icon-button danger" type="button" title="退出 App（托管继续在后台）" aria-label="退出 App">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3v9M6.4 5.6a9 9 0 1 0 11.2 0" />
          </svg>
        </button>
      </footer>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
