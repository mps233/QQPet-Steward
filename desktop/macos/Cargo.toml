[package]
name = "qqpet-dashboard-desktop"
version = "0.8.0"
description = "macOS shell for the QQ Pet dashboard"
authors = ["QQ Pet Copilot contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
open = "5.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# rust-lang/rust#157750: stripped proc-macro dylibs may not load on macOS 27.
# Build-time crates are not shipped in the app; keep the release binary profile.
[profile.release.build-override]
strip = "none"
